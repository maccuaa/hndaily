# hndaily docker-compose service entry
#
#
# One-time setup before first `docker compose up`:
#   1. Create the bind-mount directory and make it writable by the
#      container's non-root user (uid/gid 1000, "bun" in the oven/bun
#      image):
#        mkdir -p ./data/hndaily
#        docker run --rm -v "$(pwd)/data/hndaily:/data" --user root \
#          oven/bun:1 chown -R 1000:1000 /data
#   2. Copy config.example.json to ./config/hndaily.json (see ticket 01).
#      The whole ./config directory is mounted (rather than just the file)
#      so config.json can be hot-reloaded (no restart needed): editors/deploy
#      scripts typically replace a file by renaming a new one over it, which
#      would silently orphan a single-file bind mount on the old inode.
#   3. Add the HNDAILY_* variables (below) to the shared root .env file:
#        HNDAILY_SMTP_HOST=<from OCI Console > Email Delivery > Configuration>
#        HNDAILY_SMTP_USERNAME=<generated SMTP credential username>
#        HNDAILY_SMTP_PASSWORD=<generated SMTP credential password>
#        HNDAILY_FROM_ADDRESS=<your OCI Email Delivery Approved Sender address>
#        HNDAILY_HEARTBEAT_URL=<your healthchecks.io check ping URL>
#        HNDAILY_NTFY_TOPIC=<your ntfy.sh topic name, optional>
#   4. Pull and start the hndaily service:
#      `docker compose pull hndaily && docker compose up -d hndaily`.

services:
  hndaily:
    image: ghcr.io/maccuaa/hndaily:latest
    restart: unless-stopped
    environment:
      - HNDAILY_SMTP_HOST=${HNDAILY_SMTP_HOST}
      - HNDAILY_SMTP_USERNAME=${HNDAILY_SMTP_USERNAME}
      - HNDAILY_SMTP_PASSWORD=${HNDAILY_SMTP_PASSWORD}
      - HNDAILY_FROM_ADDRESS=${HNDAILY_FROM_ADDRESS}
      - HNDAILY_HEARTBEAT_URL=${HNDAILY_HEARTBEAT_URL}
      - HNDAILY_NTFY_TOPIC=${HNDAILY_NTFY_TOPIC}
      - HNDAILY_DB_PATH=/data/hndaily.sqlite
      - HNDAILY_CONFIG_PATH=/config/hndaily.json
    volumes:
      - ./data/hndaily:/data
      - ./config:/config:ro
